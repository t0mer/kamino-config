id: tools
name: Tools
order: 20
items:
  - id: jq
    name: jq
    type: apt
    packages: ["jq"]
    check: "jq --version"
    check_contains: "jq-"

  - id: ripgrep
    name: ripgrep
    type: apt
    packages: ["ripgrep"]
    check: "rg --version"
    check_contains: "ripgrep"

  - id: htop
    name: htop
    type: apt
    packages: ["htop"]
    check: "htop --version"
    check_contains: "htop"

  - id: yq
    name: yq
    type: binary
    version: "4.44.3"
    source:
      amd64: "https://github.com/mikefarah/yq/releases/download/v{version}/yq_linux_amd64"
      arm64: "https://github.com/mikefarah/yq/releases/download/v{version}/yq_linux_arm64"
    check: "yq --version"
    check_contains: "{version}"

id: containers
name: Containers
order: 30
items:
  - id: docker
    name: Docker Engine
    type: script
    source: "https://get.docker.com"
    check: "docker --version"
    check_contains: "Docker version"

  - id: docker-compose
    name: Docker Compose plugin
    type: apt
    packages: ["docker-compose-plugin"]
    depends_on: ["containers/docker"]
    check: "docker compose version"
    check_contains: "Docker Compose version"

  - id: ctop
    name: ctop (container metrics)
    type: binary
    version: "0.7.7"
    source:
      amd64: "https://github.com/bcicen/ctop/releases/download/v{version}/ctop-{version}-linux-amd64"
      arm64: "https://github.com/bcicen/ctop/releases/download/v{version}/ctop-{version}-linux-arm64"
    depends_on: ["containers/docker"]
    check: "ctop -v"
    check_contains: "{version}"

  - id: monitoring-stack
    name: Monitoring Stack (Prometheus + Grafana)
    type: compose_stack
    path: stacks/monitoring
    files:
      - docker-compose.yaml
      - prometheus.yml
    env_file: optional
    secrets: ["GRAFANA_ADMIN_PASSWORD"]
    depends_on: ["containers/docker", "containers/docker-compose"]
